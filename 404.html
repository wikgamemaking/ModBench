<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · ModBench</title>
<meta name="robots" content="noindex">
<meta name="description" content="This page doesn't exist on ModBench. Head back to build and export Minecraft modpacks in your browser.">
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>
  (function(){
    let saved = null;
    try{ saved = localStorage.getItem("modbench-theme"); }catch(e){ /* storage blocked; fall back to system preference */ }
    const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if(theme === "dark") document.documentElement.setAttribute("data-theme","dark");
  })();
</script>
<style>
  :root{
    --bg: #f6f5f1;
    --surface: #ffffff;
    --border: #ddd8cc;
    --text: #262420;
    --text-dim: #6b665c;
    --accent: #2f6b4f;
    --accent-dark: #234f3a;
  }
  html[data-theme="dark"]{
    --bg: #1a1a17;
    --surface: #232320;
    --border: #3a3a35;
    --text: #ece9e1;
    --text-dim: #a6a196;
    --accent: #4f9c76;
    --accent-dark: #7fc7a2;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Atkinson Hyperlegible', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:420px;
    width:100%;
    text-align:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:40px 32px;
  }
  .logo{
    width:64px; height:64px;
    border-radius:14px;
    margin-bottom:20px;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 8px;
  }
  p{
    color:var(--text-dim);
    font-size:0.95rem;
    line-height:1.5;
    margin:0 0 28px;
  }
  code{
    background: color-mix(in srgb, var(--text) 8%, transparent);
    padding:2px 6px;
    border-radius:5px;
    font-size:0.85em;
  }
  a.btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    padding:11px 22px;
    border-radius:9px;
    transition: background .15s ease;
  }
  a.btn:hover{ background:var(--accent-dark); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/logo.png" alt="ModBench logo">
    <h1>Page not found</h1>
    <p>There's no page at <code id="path"></code>. It may have moved, or the link might be off.</p>
    <a class="btn" href="/">Back to ModBench</a>
  </div>
  <script>
    document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
